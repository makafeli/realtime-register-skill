name: Drift detection

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure every docUrl still returns HTTP 200
        id: doctor
        continue-on-error: true
        run: npm run doctor

      - name: Scrape every operation, diff against the shipped spec, auto-fix method/path drift
        id: diff
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/diff-live.mjs --fix | tee diff-report.json
          echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Regenerate lock + references for any auto-fixed operations
        id: fix
        if: always()
        run: |
          FIXED_COUNT=$(node -e "console.log((JSON.parse(require('fs').readFileSync('diff-report.json','utf8')).fixedFiles||[]).length)")
          if [ "$FIXED_COUNT" = "0" ]; then
            echo "has-fixes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-fixes=true" >> "$GITHUB_OUTPUT"
            npm run generate
            node scripts/audit-refs.mjs --update-lock
            npm run verify
          fi

      - name: Open or update the fidelity-drift auto-fix PR
        if: steps.fix.outputs.has-fixes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="fidelity-drift/auto-fix"
          git checkout -B "$BRANCH"
          git add assets/spec references
          git commit \
            -m "fix: auto-correct method/path drift from live docs" \
            -m "Auto-generated by the weekly drift-detection workflow (scripts/diff-live.mjs --fix). Fingerprint lock and generated references were regenerated in the same commit."
          git push -f origin "$BRANCH"

          FIXED_JSON=$(node -e "const r=JSON.parse(require('fs').readFileSync('diff-report.json','utf8')); console.log(JSON.stringify(r.fixedFiles, null, 2))")
          {
            echo "Auto-corrected \`method\`/\`path\` drift detected by the weekly live-docs diff. The fingerprint lock and generated references were regenerated in the same commit."
            echo
            echo '```json'
            echo "$FIXED_JSON"
            echo '```'
            echo
            echo "Run: $RUN_URL"
          } > pr-body.md

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file pr-body.md
          else
            gh pr create --title "Fidelity drift: auto-fix method/path" --body-file pr-body.md --label fidelity-drift --base main --head "$BRANCH"
          fi

      - name: Open or update fidelity-drift issue
        # always(): must still fire even if the auto-fix step above failed
        # (e.g. `npm run verify` caught a regression after patching) — that
        # failure should not swallow reporting of drift diff-live.mjs found.
        if: always() && (steps.doctor.outcome == 'failure' || steps.diff.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = `The weekly drift detection job found discrepancies between the shipped spec and the live Realtime Register documentation.\n\n`;
            body += `- doctor: ${{ steps.doctor.outcome }}\n`;
            body += `- diff: ${{ steps.diff.outcome }}\n\n`;
            if (fs.existsSync('diff-report.json')) {
              const report = fs.readFileSync('diff-report.json', 'utf8');
              body += '```json\n' + report.slice(0, 8000) + '\n```\n';
            }
            body += `\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fidelity-drift',
              per_page: 5,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Fidelity drift detected',
                labels: ['fidelity-drift'],
                body,
              });
            }
